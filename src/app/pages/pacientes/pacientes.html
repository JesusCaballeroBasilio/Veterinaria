<label>Gestion de pacientes</label>

<p> Total de pacientes: {{ totalPacientes() }}</p>
<p>Total de pacientes vacunados: {{ totalVacunado() }}</p>

<button type="button" (click)="actualizarPacienteUntracked()">Actualizar untracked</button>

<label for="idBusqueda">ID del paciente:</label>
<input
    #campoId
    id="idBusqueda"
    type="number"
    min="1"
    placeholder="Ingresa un ID"
    (input)="actualizarIdBusqueda(campoId.value)"
/>
<input 
    #nombre
    placeholder="Buscar paciente por nombre" 
    (input)="buscarPacientePorNombre(nombre.value)"
    type="text"
/>

<button type="button" [disabled]="!idValido() || cargandoBusqueda()" (click)="buscarPaciente()">
    @if(cargandoBusqueda()){
        Consultando...
    }@else{
        Consultar Paciente 
    }</button>

@if(errorBusqueda()){
    <p>Error al mostrar al paciente. {{errorBusqueda()}}
    </p>
}
<app-ficha-paciente [paciente]="pacienteRecibido()"/>

@if(cargandoPacientes()){
    <p>Cargando pacientes...</p>
}@else if(errorPacientes(); as mensaje){
    <app-alerts [mensaje]="mensaje" (cerrar)="cerrarErrorPacientes()"/>
}@else{
    <app-lista-pacientes [pacientes]="pacientesVisibles()" (pacienteSeleccionado)="recibirPaciente($event)"/>
}

<button type="button" (click)="cargarPacientes()" [disabled]="cargandoPacientes()">Recargar Pacientes</button>
